<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="olx-mcp — MCP server za OLX.ba">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1a1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <circle cx="1090" cy="120" r="300" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(80 96)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#accent)" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <path d="M16 42 L26 32 L16 22" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 44 H48" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="168" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="60" font-weight="700" fill="#f8fafc" letter-spacing="-1">olx<tspan fill="#2dd4bf">-</tspan>mcp</text>

  <text x="170" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">MCP server za OLX.ba — pretraga, oglasi, slike, sponzorstva.</text>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#cbd5e1">
    <g transform="translate(170 234)">
      <rect x="0" y="0" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="66" y="22" text-anchor="middle">36 alata</text>
    </g>
    <g transform="translate(314 234)">
      <rect x="0" y="0" width="152" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="76" y="22" text-anchor="middle">stdio server</text>
    </g>
    <g transform="translate(478 234)">
      <rect x="0" y="0" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="88" y="22" text-anchor="middle">Node 18+ / Bun</text>
    </g>
  </g>

  <g transform="translate(796 88)">
    <rect x="0" y="0" width="404" height="184" rx="14" fill="#020617" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="24" r="6" fill="#f87171"/>
    <circle cx="46" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="24" r="6" fill="#4ade80"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="80" fill="#64748b">$</text>
      <text x="44" y="80" fill="#e2e8f0">claude mcp add olx --</text>
      <text x="44" y="106" fill="#e2e8f0">npx -y @omznc/olx-mcp</text>
      <text x="24" y="150" fill="#2dd4bf">✓ spremno</text>
      <text x="110" y="150" fill="#64748b">prijava na prvi poziv</text>
    </g>
  </g>
</svg>
