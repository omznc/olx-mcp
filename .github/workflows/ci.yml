name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # dist/index.js targets Node, and the test suite runs it under Node explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build

      # The default suite is hermetic; the tests that call the live OLX API are opt-in, so a
      # slow or changed upstream cannot redden an unrelated pull request.
      - run: bun test

      # Run the live suite on main and on tags only, where a real break is worth knowing about.
      - name: Live API tests
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          OLX_LIVE_TESTS: "1"
        run: bun test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg."
            exit 1
          fi

      # Trusted publishing (OIDC): the id-token permission above is the credential, and npm
      # attaches provenance by itself. bun publish does not support it.
      - name: Publish to npm
        run: npm publish

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/index.js
