name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # dist/index.js targets Node, and the test suite runs it under Node explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build

      # dist/ is committed so `npx github:omznc/olx-mcp` works without a build step.
      # Fail loudly if someone edited src/ and forgot to rebuild.
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale. Run 'bun run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi

      - run: bun test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/index.js
